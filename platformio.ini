; Development project for the MicroMDNS library itself: unit tests and static
; analysis. Projects that USE the library never need this file, and it is left
; out of the published package (see "export" in library.json).
;
;   pio test -e native                         run the unit tests on this PC
;   pio check -e nodemcuv2 --fail-on-defect=high   static analysis of src/

[platformio]
default_envs = native

; Host-side unit tests. src/ needs the ESP8266 core and cannot build here, so
; it is filtered out; the test #includes the one file it tests (MdnsPacket.cpp),
; which uses nothing but plain byte buffers.
[env:native]
platform = native
test_filter = test_native_*
build_src_filter = -<*>

; Only used by `pio check`. It is never built or uploaded: src/ is a library,
; not a program, so it has no setup() or loop() to link.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
test_ignore = *
check_src_filters = +<src/>
; --inline-suppr honours `// cppcheck-suppress` comments in the source.
; unusedFunction is suppressed because every function it would report is the
; library's public API, which is only ever called from outside the library.
check_flags =
	cppcheck: --inline-suppr --suppress=unusedFunction --suppress=*:*/.pio/*
